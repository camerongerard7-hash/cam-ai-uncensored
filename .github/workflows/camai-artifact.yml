name: CamAI APK Artifact

on:
  push:
    paths:
      - ".github/workflows/camai-artifact.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin
      - uses: android-actions/setup-android@v4
      - name: Build upstream Android binding
        run: |
          git clone --depth 1 --branch master https://github.com/ggml-org/llama.cpp.git
          cd llama.cpp/examples/llama.android
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Locate and verify APK
        run: |
          mkdir -p dist
          APK=$(find llama.cpp/examples/llama.android -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" dist/CamAI-APK-milestone-debug.apk
          sha256sum dist/CamAI-APK-milestone-debug.apk | tee dist/SHA256SUM.txt
      - uses: actions/upload-artifact@v6
        with:
          name: CamAI-APK-milestone
          path: dist/

name: CamAI 5.4 APK Target Build

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Install Android toolchain
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.31.6"
      - name: Extract CamAI source
        run: |
          set -euxo pipefail
          unzip -q camai-source.zip
          test -d CamAI-Expert-Final/android
      - name: Fetch pinned llama.cpp
        working-directory: CamAI-Expert-Final
        run: bash scripts/fetch-llama.sh
      - name: Build APK
        working-directory: CamAI-Expert-Final/android
        run: gradle assembleDebug --stacktrace --no-daemon
      - name: Verify APK
        run: |
          set -euxo pipefail
          mkdir -p dist
          APK=$(find CamAI-Expert-Final/android/app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" dist/CamAI-5.4-debug.apk
          sha256sum dist/CamAI-5.4-debug.apk | tee dist/SHA256SUM.txt
      - uses: actions/upload-artifact@v6
        with:
          name: CamAI-5.4-debug-target
          path: dist/
